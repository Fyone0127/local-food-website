<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | Local Food Finder Kuching</title>
    <link rel="stylesheet" href="styles.css?v=auth-session-1" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>

  <body data-page="login">
    <header class="site-header">
      <a class="logo" href="index.html">
        <span>LF</span>
        <strong>Local Food Finder KCH</strong>
      </a>

      <button class="menu-btn" id="menuBtn" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="site-nav" id="siteNav">
        <a href="index.html" data-page="home">Home</a>
        <a href="about.html" data-page="about">About</a>
        <a href="foods.html" data-page="foods">Find Food</a>
        <a href="login.html" data-page="login" id="loginLink">Login</a>
        <a href="register.html" data-page="register" id="registerLink">Register</a>
        <button class="ghost small hidden" id="logoutBtn">Logout</button>
      </nav>
    </header>

    <main class="page active">
      <div class="auth-layout">
        <div class="auth-copy">
          <p class="eyebrow">Welcome back</p>
          <h1>Sign in and continue exploring Kuching food.</h1>
          <p>Use your email and password to access your account.</p>
        </div>

        <form class="auth-form" id="loginForm">
          <h2>Login</h2>
          <p class="auth-note">Enter your email and password.</p>

          <label>
            <span>Email</span>
            <input
              id="loginEmail"
              type="email"
              placeholder="example@gmail.com"
              required
            />
          </label>

          <label>
            <span>Password</span>
            <input
              id="loginPassword"
              type="password"
              placeholder="Enter your password"
              required
            />
          </label>

          <button class="primary" type="submit">Login</button>
          <a class="text-btn" href="register.html">Need an account?</a>
          <p class="form-message" id="loginMessage"></p>
        </form>
      </div>
    </main>

    <script src="shared.js?v=auth-session-1"></script>
    <script src="navbar.js?v=auth-session-1"></script>
    <script src="auth.js?v=auth-session-1"></script>
  </body>
</html>
