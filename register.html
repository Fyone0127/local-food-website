<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register | Local Food Finder Kuching</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>

  <body data-page="register">
    <header class="site-header">
      <a class="logo" href="index.html">
        <span>LF</span>
        <strong>Local Food Finder KCH</strong>
      </a>

      <button class="menu-btn" id="menuBtn" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="site-nav" id="siteNav">
        <a href="index.html" data-page="home">Home</a>
        <a href="about.html" data-page="about">About</a>
        <a href="foods.html" data-page="foods">Find Food</a>
        <a href="login.html" data-page="login" id="loginLink">Login</a>
        <a href="register.html" data-page="register" id="registerLink">Register</a>
        <button class="ghost small hidden" id="logoutBtn">Logout</button>
      </nav>
    </header>

    <main class="page active">
      <div class="auth-layout">
        <div class="auth-copy">
          <p class="eyebrow">Create account</p>
          <h1>Join Local Food Finder KCH.</h1>
          <p>Create an account with your name, email, and password.</p>
        </div>

        <form class="auth-form" id="registerForm">
          <h2>Register</h2>
          <p class="auth-note">Use a valid email and a password you can remember.</p>

          <label>
            <span>Name</span>
            <input
              id="registerName"
              type="text"
              placeholder="Enter your full name"
              required
            />
          </label>

          <label>
            <span>Email</span>
            <input
              id="registerEmail"
              type="email"
              placeholder="example@gmail.com"
              required
            />
          </label>

          <label>
            <span>Password</span>
            <input
              id="registerPassword"
              type="password"
              placeholder="Create a password"
              required
            />
          </label>

          <button class="primary" type="submit">Create account</button>
          <a class="text-btn" href="login.html">Already registered?</a>
          <p class="form-message" id="registerMessage"></p>
        </form>
      </div>
    </main>

    <script src="shared.js"></script>
    <script src="navbar.js"></script>
    <script src="auth.js"></script>
  </body>
</html>
